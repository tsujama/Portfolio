<section id="thoughts" class="thoughts">
    <div class="content-wrapper flex-end flex-column">
        <p class="thoughts-eyebrow margin-m">IN THEIR WORDS:</p>
        <h2 class="heading-h2 text-align heading-underline">Colleagues' Thoughts</h2>
        <div class="thoughts-wrapper middle">
            @for (thought of thoughts; track thought.name) {
            <div class="thoughts-item" 
            [style.transform]="'rotate(' + thought.rotation + ')'"
            [style.background-image]="'url(&quot;' + thought.backgroundImg + '&quot;)'"
            >
                <p>{{ thought.text }}</p>
                <div class="colleague-wrapper">
                    <div>
                        <p class="bold">{{ thought.name }}</p>
                        <p>{{ thought.position }}</p>
                    </div>
                    <div>
                        <p class="linkedin">
                            <i class="fa-brands fa-linkedin"></i>
                            <a [href]="thought.linkedin">Profile</a>
                        </p>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
